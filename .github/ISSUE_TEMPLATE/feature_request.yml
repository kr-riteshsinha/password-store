name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [Roadmap](https://github.com/kr-riteshsinha/password-store#roadmap) and the existing issues first.
        Note: Password Store is a **single-user vault** (like the macOS Passwords app), so multi-profile features are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
