name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        **Don't report security vulnerabilities here.** Follow [SECURITY.md](https://github.com/kr-riteshsinha/password-store/blob/main/SECURITY.md) instead.
        Please check [ISSUES.md](https://github.com/kr-riteshsinha/password-store/blob/main/ISSUES.md) and the existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. 1.0.0 or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any real passwords or personal data first.
